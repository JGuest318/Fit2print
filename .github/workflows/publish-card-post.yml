name: Stage approved Behind the Print release

on:
  push:
    branches:
      - btp/the-card-i-didnt-know-i-needed

permissions:
  contents: write

jobs:
  publish-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: btp/the-card-i-didnt-know-i-needed

      - name: Insert approved Behind the Print post
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/blog-posts.ts')
          text = path.read_text(encoding='utf-8')
          slug = 'the-card-i-didnt-know-i-needed'
          if f'slug: "{slug}"' not in text:
              marker = 'export const BLOG_POSTS: BlogPost[] = [\n'
              if marker not in text:
                  raise SystemExit('Behind the Print post index marker not found')
              post = '''  {
            slug: "the-card-i-didnt-know-i-needed",
            title: "The Card I Didn’t Know I Needed",
            excerpt:
              "A trip to the Bloomington Public Library for a simple library card became a reminder that learning, creativity, and community can meet us differently at every stage of life.",
            date: "2026-08-27",
            seoTitle: "The Card I Didn’t Know I Needed | Behind the Print",
            metaDescription:
              "A library card reconnects John with the stacks, creative possibility, community, and the challenge of learning how to explain decades of photography experience.",
            tags: [
              "Behind The Print",
              "Bloomington Public Library",
              "Photography",
              "Creative Growth",
              "Community",
              "Lifelong Learning",
            ],
            image: "/photos/the-card-i-didnt-know-i-needed.jpeg",
            imageAlt:
              "Illustrated John in his power wheelchair holding up a library card while talking with the established AI character inside a warmly lit library.",
            imageCaption:
              "Sometimes the thing you went in to get is only the beginning of what you find.",
            imageCredit: "AI-assisted artwork for Photography Fit 2 Print.",
            imageWidth: 1536,
            imageHeight: 864,
            content: [
              "I went to the Bloomington Public Library for a library card.",
              "At 59 years old.",
              "I remember thinking, What in the hell do I need a library card for? I don’t have a paper due. 😂",
              "Turns out, that was probably the wrong question.",
              "I’m no stranger to libraries. One of my first meaningful jobs was working at the Queens Public Library in New York while I was still in high school. I knew the stacks. I knew what libraries represented then.",
              "Books. Information. Research. A place to learn.",
              "What I hadn’t considered was what a library might mean to me now.",
              "Walking through the Bloomington Public Library, I started noticing things I wasn’t expecting. Creative spaces. Meeting rooms. Podcast resources. Technology. Places where people can gather, make things, learn something new, and share what they already know.",
              "The building had changed from the version of a library I had carried around in my head.",
              "Maybe I had changed too.",
              "These days I walk into places differently.",
              "I’m an artist and photographer. I notice light. I notice people. I notice spaces and possibilities. I’m usually wondering what could happen there, what could be photographed there, or what story might be hiding somewhere that everybody else just walked past.",
              "That curiosity is part of why my camera is rarely very far away.",
              "The funny thing is, I went into the library looking for access and walked out thinking about contribution.",
              "I learned about Bloomington Public Library’s Innovator-in-Residence program, where artists and other creatives can spend time sharing their craft with members of the community.",
              "Photography is included.",
              "Now, before anybody gets ahead of me, I haven’t signed myself up for another career. 😂",
              "I’m considering applying.",
              "And part of the reason has very little to do with whether I’m eventually selected.",
              "I want the exercise.",
              "Can I take decades of experience making photographs and explain what I actually know?",
              "Can I talk about why I make certain decisions?",
              "Can I explain light, composition, printing, storytelling and all the little choices that happen before somebody ever sees the finished photograph?",
              "Can I take something that has become almost instinctive through years of repetition and turn it back into understandable language for somebody who is just beginning?",
              "That interests me.",
              "Because knowing how to do something and knowing how to explain it are two different skills.",
              "Putting together an application also requires another kind of discipline. You have to gather your experience, decide what matters, explain your ideas clearly and make a case for why somebody should consider you.",
              "I need practice doing that too.",
              "Maybe I apply and get selected.",
              "Maybe I apply and don’t.",
              "Maybe I work through the process and decide the timing isn’t right.",
              "All three outcomes can still teach me something.",
              "There was a time when I probably would have seen an opportunity I liked and immediately started figuring out how to do everything associated with it.",
              "I’m learning to approach things differently now.",
              "Clarity.",
              "Responsibility.",
              "Self-awareness.",
              "Those things are required to make photographs well, run a business well, build relationships well and, apparently, decide whether you should volunteer to teach four photography classes at the public library.",
              "Who knew?",
              "There’s another part of this story that I like.",
              "I started working in a library when I was a teenager in Queens.",
              "Decades later, I walked into another library in Bloomington, Illinois, thinking I was simply getting a card.",
              "Instead, I found myself thinking again about learning, art, photography, community and what I might have to contribute.",
              "Turns out I wasn’t a stranger to the stacks.",
              "I just didn’t know what they might hold for me this time around.",
              "And that little plastic card?",
              "I think I needed it after all.",
              "> Fit 2 Capture. Fit 2 Curate. Fit 2 Print.",
            ],
          },
          '''
              path.write_text(text.replace(marker, marker + post, 1), encoding='utf-8')
          PY

      - name: Stage approved hero image
        shell: bash
        run: |
          mkdir -p public/photos
          curl -L --fail --silent --show-error "https://at.adobe.com/CPDOUzRbm8FOPgK7" -o /tmp/the-card-hero
          mime="$(file -b --mime-type /tmp/the-card-hero)"
          case "$mime" in
            image/jpeg)
              mv /tmp/the-card-hero public/photos/the-card-i-didnt-know-i-needed.jpeg
              ;;
            image/png)
              mv /tmp/the-card-hero public/photos/the-card-i-didnt-know-i-needed.png
              sed -i 's#/photos/the-card-i-didnt-know-i-needed.jpeg#/photos/the-card-i-didnt-know-i-needed.png#' lib/blog-posts.ts
              ;;
            *)
              echo "Unexpected hero MIME type: $mime" >&2
              exit 1
              ;;
          esac

      - name: Commit completed package to release branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/blog-posts.ts public/photos/the-card-i-didnt-know-i-needed.*
          git commit -m "Publish The Card I Didn’t Know I Needed"
          git push origin HEAD:btp/the-card-i-didnt-know-i-needed
