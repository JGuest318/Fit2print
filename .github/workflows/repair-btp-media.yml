name: Repair BTP media

on:
  push:
    branches:
      - fix-first-party-btp-media-2026-09-11
    paths:
      - .github/workflows/repair-btp-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix-first-party-btp-media-2026-09-11

      - name: Download verified article media
        shell: bash
        run: |
          set -euo pipefail
          dir='public/blog/see-it-in-color-before-you-kill-the-color'
          mkdir -p "$dir"
          curl --fail --location --retry 3 'https://at.adobe.com/quz0Exv8d2hmljZx' --output "$dir/bw-portrait.jpg"
          curl --fail --location --retry 3 'https://at.adobe.com/kRQ0KJk5pqotIV3Q' --output "$dir/color-portrait.jpg"
          curl --fail --location --retry 3 'https://at.adobe.com/Hl5bhw3DYL3ZO952' --output "$dir/print-still.jpg"

      - name: Validate downloaded JPEGs
        shell: bash
        run: |
          set -euo pipefail
          dir='public/blog/see-it-in-color-before-you-kill-the-color'
          for f in "$dir/bw-portrait.jpg" "$dir/color-portrait.jpg" "$dir/print-still.jpg"; do
            file "$f"
            test "$(wc -c < "$f")" -gt 50000
            python - "$f" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          b = p.read_bytes()
          if not (b.startswith(b'\xff\xd8') and b.endswith(b'\xff\xd9')):
              raise SystemExit(f'Invalid JPEG markers: {p}')
          print(f'{p}: valid JPEG markers, {len(b)} bytes')
          PY
          done

      - name: Commit repaired media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/blog/see-it-in-color-before-you-kill-the-color/
          if git diff --cached --quiet; then
            echo 'No media changes to commit.'
            exit 0
          fi
          git commit -m 'Replace corrupted BTP media with valid JPEGs'
          git push origin HEAD:fix-first-party-btp-media-2026-09-11
